<header class="topbar">
  <form class="search" (ngSubmit)="search()" role="search">
    <app-icon name="search" [size]="17"/>
    <label for="album-search" class="sr-only">Buscar álbumes y fotos</label>
    <input id="album-search" [(ngModel)]="query" name="query" placeholder="Buscar álbumes y fotos" autocomplete="off">
    @if(query){<button type="button" class="search-clear" (click)="query=''" aria-label="Limpiar búsqueda"><app-icon name="close" [size]="15"/></button>}
  </form>
  <div class="top-actions">
    <app-notification-bell />
    <button type="button" class="mobile-theme" (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'" [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'"><app-icon [name]="theme.isDark() ? 'sun' : 'moon'" [size]="17"/></button>
    <app-user-menu [items]="menu" />
  </div>
</header>
