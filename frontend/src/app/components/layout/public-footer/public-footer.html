<footer class="public-footer">
  <div class="public-footer__inner">
    <a class="footer-brand" routerLink="/">
      <img src="logo_white.png" alt="" width="30" height="30" loading="lazy" decoding="async"><span>AlbumFP</span>
    </a>

    <div class="footer-autor">
      <span>Hecho por {{ autor }}</span>
      <ul class="footer-redes">
        @for (red of redes; track red.nombre) {
        <li>
          <a [href]="red.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="red.nombre + ' de ' + autor"
            [title]="red.nombre">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="currentColor">
              <path [attr.d]="red.path" />
            </svg>
          </a>
        </li>
        }
      </ul>
    </div>

    <small>&copy; 2026 AlbumFP · <span class="footer-version">v{{ version }}</span></small>
  </div>
</footer>
