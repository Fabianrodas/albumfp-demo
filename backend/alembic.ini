# Alembic solo necesita saber donde viven las revisiones. La conexion la pone
# migrations/env.py reutilizando el engine de la aplicacion, asi que aqui no
# hay ninguna credencial: el .env sigue siendo el unico sitio donde vive la
# cadena de conexion.
[alembic]
script_location = migrations
prepend_sys_path = .
